services:
  # Express + WebSocket backend
  farmquest-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: farmquest-server
    environment:
      - PORT=3001
      - DATABASE_URL=/app/data/farmquest.db
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-development}
      - EMAIL_FROM=${EMAIL_FROM:-FarmQuest <rewards@example.com>}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - db-data:/app/data
      - upload-data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx reverse proxy + static file serving
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: farmquest-nginx
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      farmquest-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/admin",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
    driver: local
  upload-data:
    driver: local
